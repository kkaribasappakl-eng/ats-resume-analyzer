<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareerBoost AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex align-items-center hero-gradient">

    <!-- Theme Toggle Fixed Top Right -->
    <div class="position-absolute top-0 end-0 p-4">
        <button class="theme-toggle-btn" id="theme-toggle">
            <i class="bi bi-sun-fill fs-5" id="sun-icon"></i>
            <i class="bi bi-moon-stars-fill fs-5 d-none" id="moon-icon"></i>
        </button>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <a th:href="@{/}" class="text-decoration-none">
                        <h2 class="fw-bold" style="color: var(--primary-color)"><i class="bi bi-cpu ai-glow"></i> CareerBoost AI</h2>
                    </a>
                </div>
                
                <div class="card-glass border-0 p-4 p-md-5">
                    <h4 class="fw-bold mb-4 text-center">Welcome Back</h4>
                    
                    <div th:if="${param.error}" class="alert alert-danger py-2 border-0 bg-danger bg-opacity-10 text-danger rounded-3">
                        <i class="bi bi-exclamation-triangle"></i> Invalid username or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2 border-0 bg-success bg-opacity-10 text-success rounded-3">
                        <i class="bi bi-check-circle"></i> You have been logged out.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success py-2 border-0 bg-success bg-opacity-10 text-success rounded-3">
                        <i class="bi bi-check-circle"></i> Registration successful! Please log in.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-4">
                            <label for="username" class="form-label fw-semibold text-secondary small">Username</label>
                            <input type="text" class="form-control form-control-lg bg-transparent text-primary" id="username" name="username" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-secondary small">Password</label>
                            <input type="password" class="form-control form-control-lg bg-transparent text-primary" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 btn-lg mt-2">Sign In</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-secondary mb-0">Don't have an account? <a th:href="@{/register}" class="text-primary text-decoration-none fw-semibold">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
