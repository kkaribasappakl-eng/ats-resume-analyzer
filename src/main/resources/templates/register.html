<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CareerBoost AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex align-items-center hero-gradient" style="min-height: 100vh;">

    <div class="position-absolute top-0 end-0 p-4">
        <button class="theme-toggle-btn" id="theme-toggle">
            <i class="bi bi-sun-fill fs-5" id="sun-icon"></i>
            <i class="bi bi-moon-stars-fill fs-5 d-none" id="moon-icon"></i>
        </button>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="text-center mb-4">
                    <a th:href="@{/}" class="text-decoration-none">
                        <h2 class="fw-bold" style="color: var(--primary-color)"><i class="bi bi-cpu ai-glow"></i> CareerBoost AI</h2>
                    </a>
                </div>
                
                <div class="card-glass border-0 p-4 p-md-5">
                    <h4 class="fw-bold mb-4 text-center">Create Account</h4>
                    
                    <div th:if="${error}" class="alert alert-danger py-2 border-0 bg-danger bg-opacity-10 text-danger rounded-3">
                        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/register}" method="post" th:object="${user}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Username</label>
                            <input type="text" class="form-control form-control-lg bg-transparent text-primary" th:field="*{username}" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Email Address</label>
                            <input type="email" class="form-control form-control-lg bg-transparent text-primary" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small">Password</label>
                            <input type="password" class="form-control form-control-lg bg-transparent text-primary" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small">Confirm Password</label>
                            <input type="password" class="form-control form-control-lg bg-transparent text-primary" th:field="*{confirmPassword}" required>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 btn-lg mt-2">Create Account</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-secondary mb-0">Already have an account? <a th:href="@{/login}" class="text-primary text-decoration-none fw-semibold">Sign in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
